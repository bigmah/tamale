[package]
name = "tamale-web-client"
version = "0.1.0"
edition = "2024"
description = "tamale's browser client: draws the TUI tamale sends and returns input"
publish = false

# Built for wasm32 by web/build.sh, separately from tamale itself.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
ratzilla = "0.3"
tamale-web-protocol = { path = "../protocol" }
# Must match the wasm-bindgen CLI that web/build.sh runs.
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "BinaryType",
    "ClipboardEvent",
    "CloseEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "WebSocket",
    "WheelEvent",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
