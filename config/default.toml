# Built into the binary. Copy any sections to ~/.config/tamale/config.toml
# for personal defaults, or tamale.toml in a project. All fields are optional
# in those files; omitted fields keep the value from the previous layer.

[backend]
# Where inference comes from:
#   api          the Anthropic API, using ANTHROPIC_API_KEY
#   claude-code  your Claude Code sign-in (subscription or Console), by running the
#                `claude` CLI headlessly; sign in with `claude auth login` or /login
#   codex        your Codex sign-in (ChatGPT plan or OpenAI API key), by running the
#                `codex` CLI headlessly; sign in with `codex login` or /login
# Tools, permissions, undo and sessions work the same with each.
kind = "api"
claude_path = "claude" # the Claude Code executable (searched on PATH)
# More Claude Code logins for the /backend picker: config directories (CLAUDE_CONFIG_DIR)
# each signed in to an account. Accounts added from the picker are kept by tamale and
# don't need listing here; ~/.claude is offered automatically when signed in.
claude_config_dirs = [] # e.g. ["~/.claude-work"]
codex_path = "codex" # the Codex executable (searched on PATH)
# More Codex logins for the /backend picker: home directories (CODEX_HOME) each signed in
# to an account. ~/.codex is offered automatically when signed in. The codex backend uses
# model.name unless it's a Claude model, in which case Codex picks its default.
codex_homes = [] # e.g. ["~/.codex-work"]

[model]
name = "claude-opus-5-5"
effort = "default" # low, medium, high, xhigh, max, or default (API decides)
thinking = "adaptive" # adaptive (or on), off
# context_window = 1000000 # omit to infer from the selected model

[agent]
max_tokens = 64000 # per response (including thinking); truncated responses continue automatically
compact_max_tokens = 8000
auto_compact_percent = 80 # 1–100
max_retries = 5 # retries after the initial attempt; 0 disables retries
request_timeout_secs = 300 # timeout opening a stream or waiting for its next event

[ui]
verbose = false
mouse = true

[permissions]
# ask: prompt before edits and shell commands. accept-edits: prompt before shell
# commands only. auto: never prompt. Shift+Tab cycles modes in the TUI; -p denies
# anything that would prompt unless --yes is passed.
mode = "auto"
# Rules are "tool" or "tool:glob", matched on the command (bash), path (file tools),
# URL (web_fetch), query (web_search) or task (agent); `*` also matches `/`. Every part
# of a compound bash command must be allowed. Deny rules are checked first and apply in
# every mode. deny = ["agent"] turns subagents off.
# Lists from all settings layers are combined.
allow = [] # e.g. ["bash:cargo *", "bash:git status*", "bash:git diff*"]
deny = [] # e.g. ["bash:git push*", "bash:rm -rf *", "write_file:.env*"]

[hub]
# A tamale-hub to make this session reachable through from a phone or another computer
# (see single_key.md). Make a key on the hub's site, and set it in TAMALE_HUB_KEY.
url = "wss://tamale-hub.com"      # or TAMALE_HUB_URL
connect = "manual"                # manual: only with /remote; auto: also on startup
e2e = true                        # encrypt between tamale and the browser, so the hub sees
                                  # only opaque bytes (see e2e.md); false is for debugging
