[package]
name = "tamale"
version = "0.1.22"
edition = "2024"
repository = "https://github.com/bigmah/tamale"

[workspace]
members = ["browser/protocol", "hub", "hub/protocol"]
# Built for wasm32 by build.rs, as is web/ (a workspace of its own).
exclude = ["browser/client"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
futures = "0.3.34"
getrandom = "0.3"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", features = ["query", "json", "gzip"] }
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
# The review panel's host protocol (src/web/pullspace.rs) and the stylesheet rewrite that
# keeps the page's rules out of pullspace's box. pullspace itself is drawn by web/, which
# depends on the `pullspace` crate; the built bundle (the `assets` feature) isn't needed.
pullspace-embed = { git = "https://github.com/bigmah/pullspace", rev = "25ecd3b60dda6f6add7a441ec83e65ab90750419", default-features = false }
tamale-browser-protocol = { path = "browser/protocol" }
tamale-hub-protocol = { path = "hub/protocol" }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2.3"
qrcode = { version = "0.14.1", default-features = false }
# Not the defaults: its `std` feature turns on ring, and only AESGCM/SHA256/25519 are used.
# (chacha is only here because snow 0.10 imports `KeyInit` for AES-GCM under that feature.)
snow = { version = "0.10", default-features = false, features = ["use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

# build.rs: builds web/ and browser/client for the browser and embeds them.
[build-dependencies]
# Must match the wasm-bindgen both of those crates pin.
wasm-bindgen-cli-support = "=0.2.130"
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
rqrr = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
