[package]
name = "tamale"
version = "0.1.2"
edition = "2024"
repository = "https://github.com/bigmah/tamale"

[workspace]
members = ["web/protocol", "hub", "hub/protocol"]
# Built for wasm32 by web/build.sh.
exclude = ["web/client"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
futures = "0.3.34"
getrandom = "0.3"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", features = ["query", "json", "gzip"] }
rig-core = "0.42"
scraper = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tamale-web-protocol = { path = "web/protocol" }
tamale-hub-protocol = { path = "hub/protocol" }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2.3"
qrcode = { version = "0.14.1", default-features = false }
snow = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
rqrr = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
