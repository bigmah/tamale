[package]
name = "tamale"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
getrandom = "0.3"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-backend-writer", "unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", features = ["query", "json", "gzip"] }
rig-core = "0.42"
scraper = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
