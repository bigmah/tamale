[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
globset = "0.4"
ignore = "0.4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", features = ["query", "json", "gzip"] }
rig-core = "0.42"
scraper = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"
