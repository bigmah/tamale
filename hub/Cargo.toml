[package]
name = "tamale-hub"
version = "0.1.0"
edition = "2024"
description = "A self-hosted relay that makes tamale sessions reachable from anywhere"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "json", "query"] }
futures = "0.3"
getrandom = "0.3"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tamale-hub-protocol = { path = "protocol" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
