# XcodeGen spec for the iOS app (see apple/ios.md). The .xcodeproj is generated, not checked in:
#
#   cd apple && xcodegen generate && open Tamale.xcodeproj
#
# Set DEVELOPMENT_TEAM (or override it on the xcodebuild command line) to sign for a device.
name: Tamale
options:
  bundleIdPrefix: com.radkey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ABTR54GY4X
    CODE_SIGN_STYLE: Automatic
packages:
  TamaleKit:
    path: Packages/TamaleKit
targets:
  Tamale:
    type: application
    platform: iOS
    sources:
      - path: Tamale
    dependencies:
      - package: TamaleKit
    entitlements:
      path: Tamale/Resources/Tamale.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:tamale-hub.com
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: Tamale/Resources/Info.plist
      properties:
        CFBundleDisplayName: tamale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: tamale scans the QR code on your hub's site to add a key, or a terminal's code to open a session.
        NSFaceIDUsageDescription: tamale can ask for Face ID before showing your sessions.
        ITSAppUsesNonExemptEncryption: false
        # Self-hosted hubs on a local network may be plain http (`--insecure`), and the
        # simulator tests use one at http://hub.localhost:<port>.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.radkey.tamale
            CFBundleURLSchemes: [tamale]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radkey.tamale
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  TamaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TamaleUITests
    dependencies:
      - target: Tamale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radkey.tamale.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tamale:
    build:
      targets:
        Tamale: all
        TamaleUITests: [test]
    test:
      targets:
        - TamaleUITests
