<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e2026">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tamale">
<meta name="format-detection" content="telephone=no">
<title>tamale</title>
<!-- 🫔, percent-encoded: <svg …><text …>🫔</text></svg> -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20x='50'%20y='50'%20font-size='88'%20text-anchor='middle'%20dominant-baseline='central'%3E%F0%9F%AB%94%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🫔</span><span class="brand-name">tamale</span></div>
    <div class="wschip" id="project">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 3h4.1l1.4 1.5h7a.75.75 0 0 1 .75.75v7.5a.75.75 0 0 1-.75.75H1.75a.75.75 0 0 1-.75-.75v-9A.75.75 0 0 1 1.75 3Z"/></svg>
      <span id="project-name">…</span><span class="wschip-dirs" id="project-dirs"></span>
    </div>
    <!-- What's on screen: the chat, the code (pullspace) or both. See setView in app.js. -->
    <div class="viewsw" id="viewsw" role="group" aria-label="Layout">
      <button id="view-chat" title="Chat" aria-label="Chat">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.75c0-.69.56-1.25 1.25-1.25h8.5c.69 0 1.25.56 1.25 1.25v6c0 .69-.56 1.25-1.25 1.25H7l-3 2.5V11h-.25c-.69 0-1.25-.56-1.25-1.25Z"/></svg>
      </button>
      <button id="view-split" title="Chat and code, side by side" aria-label="Chat and code, side by side">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.75" width="12" height="10.5" rx="1.75"/><path d="M8 2.75v10.5"/></svg>
      </button>
      <button id="view-code" title="Code  ⌘B" aria-label="Code">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5.6 6.7 6.2-3.6 1.5 2.6-6.2 3.6ZM2.6 9.1l3.3-1.9.9 1.6-3.3 1.9ZM8.4 3.8l1.4-.8M8.8 8.4 6.3 14M8.8 8.4l2.5 5.6"/></svg>
        <span class="viewsw-n" id="changes-n" hidden></span>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="meters">
      <button class="pill mode" id="mode" title="Permission mode (click to cycle)"></button>
      <button class="pill model" id="model" title="Model (click to switch)"></button>
      <span class="ctx" id="ctx"><span class="ctx-bar"><span class="ctx-fill" id="ctx-fill"></span></span><span id="ctx-label"></span></span>
      <span class="cost" id="cost"></span>
    </div>
    <!-- Talk to the session through Gemini (see the Gemini section of app.js). -->
    <button class="iconbtn voicebtn" id="toggle-voice" title="Talk to tamale with Gemini  /voice" aria-label="Talk to tamale with Gemini">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6.5v3M5 4.5v7M7.75 2.5v11M10.5 5v6M13.25 6.75v2.5"/></svg>
    </button>
    <button class="iconbtn" id="toggle-artifacts" title="Artifacts from this and earlier sessions  /artifacts">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 5.5h12M5 8.5h6M5 10.75h3.5"/></svg>
    </button>
    <button class="kitchen-toggle" id="toggle-kitchen" title="Your sessions" hidden>
      <span class="kt-mark">🫔</span><span class="kt-count" id="kitchen-count"></span>
    </button>
    <button class="iconbtn endbtn" id="end-session" title="Close this session  /quit" aria-label="Close this session">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.25v5.5M4.4 4.6a5 5 0 1 0 7.2 0"/></svg><span class="end-label">Stop chef</span>
    </button>
    <span class="conn" id="conn" title="Connecting…"></span>
  </header>

  <main class="main" id="main">
    <section class="chat">
      <div class="scroller" id="scroller">
        <div class="thread" id="thread">
          <div class="hero" id="hero">
            <div class="hero-mark">🫔</div>
            <h1>What should we work on?</h1>
            <p class="hero-sub" id="hero-sub"></p>
            <div class="hero-chips">
              <button class="chip" data-prompt="Give me a tour of this codebase: what it does, how it's laid out, and where to start reading.">Give me a tour of this codebase</button>
              <button class="chip" data-prompt="Look through the code for likely bugs and tell me the most serious ones.">Look for likely bugs</button>
              <button class="chip" data-command="/review"><kbd class="keys-only">⌘B</kbd> Open the code</button>
            </div>
          </div>
        </div>
        <div class="activity" id="activity" hidden>
          <span class="spark"></span><span class="act-label" id="act-label">Thinking</span>
          <span class="act-time" id="act-time"></span>
          <span class="act-meta" id="act-meta"></span>
          <span class="act-hint keys-only"><kbd>esc</kbd> to interrupt</span>
          <p class="act-note" id="act-note" hidden></p>
        </div>
      </div>

      <div class="dock">
        <button class="jump" id="jump" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>Latest
        </button>
        <div class="toast" id="toast" hidden></div>
        <div class="queued" id="queued"></div>
        <div class="voice" id="voice" hidden></div>
        <div class="approval" id="approval" hidden></div>
        <div class="question" id="question" hidden></div>
        <div class="composer" id="composer">
          <div class="slash" id="slash" hidden></div>
          <textarea id="input" rows="1" spellcheck="true" placeholder="Ask tamale anything…   / for commands" enterkeyhint="enter" autofocus></textarea>
          <button class="make-artifact make-video" id="make-video" title="Make an animated video of this (Manim)  /video" aria-label="Make an animated video">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="3.25" width="12.5" height="9.5" rx="1.75"/><path d="M6.5 6v4l3.5-2z"/></svg>
          </button>
          <button class="make-artifact" id="make-artifact" title="Generate an artifact" aria-label="Generate an artifact">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5 8.2 5.8 11.5 7 8.2 8.2 7 11.5 5.8 8.2 2.5 7 5.8 5.8z"/><path d="M12 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg>
          </button>
          <button class="send" id="send" title="Send (⏎)">
            <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
            <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
          </button>
        </div>
        <div class="hints">
          <span id="hint-left"></span>
          <span class="keys-only"><kbd>⏎</kbd> send <kbd>⇧⏎</kbd> newline <kbd>/</kbd> commands</span>
        </div>
      </div>
    </section>

    <!-- The seam between the chat and the code; drag it to resize them. -->
    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the chat and the code" tabindex="0" title="Drag to resize · double-click to reset" hidden></div>

    <!-- pullspace, the code: the working tree against HEAD, in a frame (see src/web/pullspace.rs).
         It has a bar of its own, so this has none. -->
    <section class="review" id="review" aria-label="Code" hidden>
      <div class="review-wait" id="review-wait">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5.6 6.7 6.2-3.6 1.5 2.6-6.2 3.6ZM2.6 9.1l3.3-1.9.9 1.6-3.3 1.9ZM8.4 3.8l1.4-.8M8.8 8.4 6.3 14M8.8 8.4l2.5 5.6"/></svg>
        <span class="review-wait-bar"></span>
        <span id="review-wait-note">Opening the code…</span>
      </div>
    </section>

    <!-- The seam before the kitchen; shows with it, beside the chat (see app.css). -->
    <div class="divider k-divider" id="k-divider" role="separator" aria-orientation="vertical" aria-label="Resize the kitchen" tabindex="0" title="Drag to resize · double-click to reset"></div>

    <!-- A chef's sessions (see src/chef.rs); hidden in every other session. -->
    <aside class="kitchen" id="kitchen" hidden>
      <div class="k-hdr">
        <span class="k-mark">🫔</span>
        <span class="k-title">Kitchen</span>
        <span class="k-live" id="k-live" title="Refreshes every few seconds"></span>
        <div class="spacer"></div>
        <button class="iconbtn sm k-close" id="k-close" title="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="k-stats" id="k-stats"></div>
      <div class="k-list" id="k-list"></div>
      <div class="k-foot">
        <button class="k-askall" id="k-askall">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.75c0-.69.56-1.25 1.25-1.25h8.5c.69 0 1.25.56 1.25 1.25v6c0 .69-.56 1.25-1.25 1.25H7l-3 2.5V11h-.25c-.69 0-1.25-.56-1.25-1.25Z"/></svg>
          Ask every session…
        </button>
      </div>
    </aside>
  </main>

  <!-- Where the toast goes while the chat, and the dock it lives in, is out of sight. -->
  <div class="toast float" id="toast-float" hidden></div>

  <div class="pickmask" id="artifacts" hidden>
    <div class="pickbox artbox" id="art-box" role="dialog" aria-label="Artifacts">
      <div class="art-hdr">
        <input class="pickinput" id="art-find" placeholder="Filter artifacts…" spellcheck="false" autocomplete="off">
        <button class="iconbtn sm" id="art-close" title="Close (esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="art-body">
        <div class="art-list" id="art-list"></div>
        <div class="divider art-divider" id="art-divider" role="separator" aria-orientation="vertical" aria-label="Resize the list" tabindex="0" title="Drag to resize · double-click to reset"></div>
        <div class="art-view" id="art-view"></div>
      </div>
    </div>
  </div>

  <div class="pickmask" id="models" hidden>
    <div class="pickbox modelbox" role="dialog" aria-label="Models">
      <div class="art-hdr">
        <input class="pickinput" id="model-find" placeholder="Filter models…" spellcheck="false" autocomplete="off" autocapitalize="off" role="combobox" aria-controls="model-list" aria-expanded="true">
        <button class="iconbtn sm" id="model-close" title="Close (esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="model-note" id="model-note" hidden></div>
      <div class="model-list" id="model-list" role="listbox" aria-label="Models"></div>
    </div>
  </div>

  <div class="pickmask" id="ending" hidden>
    <div class="pickbox endbox" role="alertdialog" aria-modal="true" aria-labelledby="end-title" aria-describedby="end-text">
      <h2 id="end-title">Close this session?</h2>
      <p id="end-text"></p>
      <div class="end-actions">
        <button class="btn" id="end-cancel">Cancel</button>
        <button class="btn end-go" id="end-go">Close session</button>
      </div>
    </div>
  </div>

  <div class="pickmask" id="help" hidden>
    <div class="pickbox helpbox" id="help-body"></div>
  </div>
</div>
</body>
</html>
