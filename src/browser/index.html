<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tamale</title>
<style>
/*XTERM_CSS*/
html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
#term { position: absolute; inset: 6px; }
#notice {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  padding: 10px 16px; border-radius: 6px; background: #333; color: #eee;
  font: 14px system-ui, sans-serif;
}
#notice[hidden] { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="notice" hidden></div>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>
const container = document.getElementById('term');
const term = new Terminal({
  scrollback: 0,
  fontFamily: 'Menlo, "SF Mono", Monaco, Consolas, "DejaVu Sans Mono", monospace',
  fontSize: 14,
  theme: { background: '#111111' },
  allowProposedApi: true,
});
// Lay out characters with tamale's widths, so cells line up with what it draws.
const widths = /*WIDTHS*/;
const within = (ranges, cp) => {
  let lo = 0, hi = ranges.length / 2 - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (cp < ranges[2 * mid]) hi = mid - 1;
    else if (cp > ranges[2 * mid + 1]) lo = mid + 1;
    else return true;
  }
  return false;
};
const wcwidth = cp => within(widths.zero, cp) ? 0 : within(widths.wide, cp) ? 2 : 1;
term.unicode.register({
  version: 'tamale',
  wcwidth,
  // As xterm.js's own providers: a zero-width character joins the one before it.
  charProperties(cp, preceding) {
    let width = wcwidth(cp);
    let join = width === 0 && preceding !== 0;
    if (join) {
      const before = (preceding >> 1) & 3;
      if (before === 0) join = false;
      else if (before > width) width = before;
    }
    return (width & 3) << 1 | (join ? 1 : 0);
  },
});
term.unicode.activeVersion = 'tamale';
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(container);
fit.fit();
term.focus();

const token = new URLSearchParams(location.search).get('t');
const ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
ws.binaryType = 'arraybuffer';
const send = message => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(message));
const sendSize = () => send({ t: 'size', cols: term.cols, rows: term.rows });
ws.onopen = sendSize;
ws.onmessage = e => term.write(new Uint8Array(e.data));
ws.onclose = e => {
  const notice = document.getElementById('notice');
  notice.textContent = e.reason || 'Disconnected from tamale. Run /browser in tamale for a new link.';
  notice.hidden = false;
  term.options.disableStdin = true;
};
term.onResize(sendSize);
new ResizeObserver(() => fit.fit()).observe(container);

// Keys go to tamale as names and modifiers, like a terminal reports them. Cmd shortcuts
// (copy, paste, closing the tab) stay with the browser, and input methods compose through
// xterm.js, whose result arrives in onData.
const modifierKeys = new Set(['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Dead', 'Process', 'Unidentified']);
term.attachCustomKeyEventHandler(e => {
  if (e.isComposing || e.keyCode === 229) return true;
  if (e.type !== 'keydown' || e.metaKey || modifierKeys.has(e.key)) return false;
  e.preventDefault();
  send({ t: 'key', key: e.key, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey });
  return false;
});
term.onData(text => {
  if (!text.startsWith('\x1b')) send({ t: 'text', text });
});
container.addEventListener('paste', e => {
  e.preventDefault();
  e.stopPropagation();
  send({ t: 'paste', text: e.clipboardData.getData('text/plain') });
}, true);

function cell(e) {
  const r = term.element.querySelector('.xterm-screen').getBoundingClientRect();
  const clamp = (v, max) => Math.max(0, Math.min(max - 1, Math.floor(v)));
  return {
    col: clamp((e.clientX - r.left) / (r.width / term.cols), term.cols),
    row: clamp((e.clientY - r.top) / (r.height / term.rows), term.rows),
  };
}
// Trackpads send many small deltas; one notch is about 100 pixels.
let wheel = 0;
container.addEventListener('wheel', e => {
  e.preventDefault();
  wheel += e.deltaMode === WheelEvent.DOM_DELTA_LINE ? e.deltaY * 33 : e.deltaY;
  while (Math.abs(wheel) >= 60) {
    send({ t: 'wheel', up: wheel < 0, ...cell(e) });
    wheel -= Math.sign(wheel) * 60;
  }
}, { passive: false });
container.addEventListener('mousedown', e => {
  if (e.button === 0) send({ t: 'click', ...cell(e) });
});
</script>
</body>
</html>
